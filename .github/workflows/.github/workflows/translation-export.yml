name: Export translation stubs

# Manual helper: creates ready-to-translate JSON files for one language (so you never need a terminal).
# Run it from the Actions tab > "Export translation stubs" > Run workflow, then download the artifact.
on:
  workflow_dispatch:
    inputs:
      language:
        description: "Language code, e.g. es, fr, de, zh-CN"
        required: true
      pages:
        description: "Which pages: stale,missing (default), all, or page names like index,faq,ubuntu-linux-usb"
        default: "stale,missing"
      limit:
        description: "Maximum number of pages to export"
        default: "20"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 build.py
      - name: Create stubs
        env:
          LANGUAGE: ${{ inputs.language }}
          PAGES: ${{ inputs.pages }}
          LIMIT: ${{ inputs.limit }}
        run: python3 i18n_build.py export --lang "$LANGUAGE" --pages "$PAGES" --limit "$LIMIT" --out translation-stubs
      - uses: actions/upload-artifact@v4
        with:
          name: translation-stubs-${{ inputs.language }}
          path: translation-stubs
          retention-days: 14
